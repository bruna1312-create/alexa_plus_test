<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alexa+</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #aee3ff, #003366, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Amazon Ember', Arial, sans-serif;
    }

    .logo-container {
      text-align: center;
      color: white;
      animation: fadeInUp 2s ease-out;
    }

    .logo-text {
      font-size: 5rem;
      font-weight: bold;
    }

    .smile {
      margin-top: -10px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-text">Alexa+</div>
    <div class="smile">
      <svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 10 C 60 50, 60 50, 110 10" stroke="white" stroke-width="5" fill="transparent" />
      </svg>
    </div>
  </div>
</body>
          </html>
